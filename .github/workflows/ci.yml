name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: mnat demo
      - name: Upload landing-zone tfvars + carve-out evidence
        uses: actions/upload-artifact@v4
        with: { name: evidence-${{ matrix.python }}, path: out/ }
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform/
      - run: cd terraform/envs/example && terraform init -backend=false && terraform validate
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: PGPASSWORD=ci psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f sql/postgres_rls.sql
      - run: PGPASSWORD=ci psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f sql/rls_test.sql
